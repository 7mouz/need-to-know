# Need-to-Know roles: one line per role.
#
#   role : folders this role may read (comma-separated, capitalization doesn't matter)
#
# A "folder" is a top-level folder name in the dataset you load with:  nk ingest-dir <dataset>
# A folder that no role lists is skipped: no agent gets it.
# After editing this file, run:  nk setup   (then reload documents: nk reset --yes; nk ingest-dir <dataset>; nk index)
# 'open-brain' is created automatically and sees everything (the "before" brain).
#
# Access follows what each job needs. HR sees pay ranges but not the roadmap;
# engineers see the roadmap but not pay ranges. No role lists 'finance', so it stays closed.

# The company these documents belong to. Change this one line if you load another company's documents.
company: Northwind
# Handoff replies go only to addresses at this domain.
email-domain: northwind.example

model: google/gemini-flash-lite-latest
# or: model: openai/gpt-6-luna   (sign each role in to ChatGPT instead of a key file; see README)

contractor : public, handbook, it
support    : public, handbook, it, product-docs, support
engineer   : public, handbook, it, product-docs, support, roadmap
hr         : public, handbook, it, hr

# Who to ask, for folders a role can't see.   ask: folder = Team | what it covers
ask: public       = Marketing team   | company facts and the product FAQ
ask: handbook     = Operations team  | office rules, time off, all-hands notes
ask: it           = IT helpdesk      | VPN, laptops, tool access
ask: product-docs = Product team     | how the product works, release notes
ask: support      = Support team     | customer tickets, known issues, the support playbook
ask: roadmap      = Product team     | product plans and release dates
ask: hr           = People team (HR) | pay ranges and hiring
ask: finance      = Finance team     | budgets, vendors, spending
