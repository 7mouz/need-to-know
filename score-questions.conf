# Everyday questions for `nk score`. One per line:
#
#   question | file that has the answer | key words a correct answer must include
#
# Key words: give alternatives with '/' (any one counts); if several are required, separate them with ';'.
# Matching is by whole words, so '20 days' does not match '2026', and '$14' does not match '14-day'.
#
# What each role SHOULD get comes from roles.conf automatically:
#   the role can see the file's folder  -> it should answer (all key words present)
#   it can't                            -> it must not get the answer (no key words)

How do I set up the VPN?                                          | it/it-runbook.md                   | PixelConnect
What is the guest Wi-Fi network called?                           | handbook/office-handbook.md        | PixelHeaven-Guest
How many vacation days do employees get each year?                | handbook/holiday-policy.md         | 20 days/20 vacation days
How much does the Team plan cost?                                 | public/product-faq.md              | $14
A customer can't sign in after updating to 3.2. What should they do? | support/known-issues.md          | cache
How do I escalate a ticket to Engineering?                        | support/support-playbook.md        | ENG-ESC
What's new in release 3.2?                                        | product-docs/release-notes-v3.2.md | SSO
When does offline mode ship?                                      | roadmap/product-roadmap.md         | February 23/Feb 23/Feb. 23
What's the salary range for a senior software engineer?           | hr/salary-ranges.md                | 150,000/150k
When is the employee referral bonus paid?                         | hr/hiring-plan-2026-q4.md          | 90th day/90 days
What is our 2026 cloud budget?                                    | finance/cloud-budget-2026.md       | 312,000/312k
